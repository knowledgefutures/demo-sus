name: Deploy

run-name: 'Deploy SUS: ${{ github.sha }}'

concurrency:
  group: deploy-sus
  cancel-in-progress: true

# Deploys main; target and SSH key come from the KF console.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Syntax check
        run: node --check sus.mjs

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
    env:
      KF: npx --yes --ignore-scripts @knowledgefutures/kf@0.7.0
      KF_CONSOLE_URL: ${{ vars.KF_CONSOLE_URL || 'https://console.knowledgefutures.org' }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Load the deploy key
        id: ssh
        run: $KF ci ssh-agent -e production

      # Build on the host with docker compose (the image is one file copied into
      # node:24-slim, so building there is faster than pushing through a registry).
      - name: Deploy over SSH
        env:
          DEPLOY_USER: ${{ steps.ssh.outputs.DEPLOY_USER }}
          DEPLOY_HOST: ${{ steps.ssh.outputs.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a commit: $SHA"; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
            "bash -s -- '$SHA'" <<'EOS'
          set -euo pipefail
          SHA="${1:?missing commit}"

          APP_DIR="/srv/sus"
          # Public demo repo, so an unauthenticated HTTPS clone works. If the
          # repo is made private, switch to git@github.com and add a deploy key.
          REPO_URL="https://github.com/knowledgefutures/demo-sus.git"
          BRANCH="main"

          if [[ ! -d "${APP_DIR}/.git" ]]; then
            sudo mkdir -p "${APP_DIR}"
            sudo chown -R "$USER:$USER" "${APP_DIR}"
            git clone --branch "${BRANCH}" "${REPO_URL}" "${APP_DIR}"
          fi

          cd "${APP_DIR}"
          git fetch --prune origin
          git checkout "${BRANCH}"
          git reset --hard "${SHA}"

          sudo docker compose up -d --build
          sudo docker image prune -f
          sudo docker compose ps
          EOS
